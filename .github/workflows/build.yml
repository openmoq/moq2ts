name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows:
        description: Build the Windows package
        type: boolean
        default: false

# Allow the release job to create GitHub Releases and upload assets.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned openmoq publisher SDK release (openmoq/moqxr, public). Bump to adopt a
  # newer SDK. Each platform archive ships include/ + lib/ of static libraries so
  # moq2ts links the real publisher (MOQ2TS_BUILD_WITH_MOCK_MOQXR=OFF) and the
  # produced binaries can connect to a real relay. OpenSSL is a system dependency.
  MOQXR_VERSION: v0.4.10

jobs:
  linux:
    name: linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config file imagemagick wget \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev \
            libssl-dev \
            libopenh264-dev \
            libavcodec-dev libavdevice-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev \
            libopus-dev \
            libsrt-openssl-dev

      - name: Fetch moqxr SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release download "$MOQXR_VERSION" --repo openmoq/moqxr \
            --pattern '*Linux*' --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/moqxr-sdk"
          tar xzf "$RUNNER_TEMP"/openmoq-publisher-*-Linux.tar.gz \
            -C "$RUNNER_TEMP/moqxr-sdk" --strip-components=1
          echo "MOQXR_SDK_DIR=$RUNNER_TEMP/moqxr-sdk" >> "$GITHUB_ENV"

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOQ2TS_BUILD_WITH_MOCK_MOQXR=OFF
          -DMOQXR_SDK_DIR="$MOQXR_SDK_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Source guards
        run: |
          # Some guards inspect the sibling ../moqxr source checkout, which is not
          # present in CI (we link the prebuilt SDK instead) -- run only the
          # self-contained ones.
          for f in $(grep -L moqxr tests/*-guards.sh); do
            echo "== $f =="
            bash "$f"
          done
          echo "skipped (need ../moqxr source): $(grep -l moqxr tests/*-guards.sh | tr '\n' ' ')"

      - name: Package AppImage
        env:
          # Extract-and-run avoids needing FUSE on the runner image.
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: /usr/lib/qt6/bin/qmake6
          # linuxdeploy's appimage plugin names the output after this bare filename.
          OUTPUT: moq2ts-publisher-linux-x86_64.AppImage
        run: |
          set -eux
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr
          mkdir -p AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cat > AppDir/usr/share/applications/moq2ts-publisher.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=moq2ts Publisher
          Exec=moq2ts-publisher
          Icon=moq2ts-publisher
          Categories=AudioVideo;
          Terminal=false
          EOF
          convert -size 256x256 xc:'#1565c0' \
            AppDir/usr/share/icons/hicolor/256x256/apps/moq2ts-publisher.png
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            --desktop-file AppDir/usr/share/applications/moq2ts-publisher.desktop \
            --output appimage
          mkdir -p dist
          mv "$OUTPUT" dist/

      - name: Package CLI AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: /usr/lib/qt6/bin/qmake6
          OUTPUT: moq2ts-cli-linux-x86_64.AppImage
        run: |
          set -eux
          mkdir -p cli-appdir/usr/share/applications \
                   cli-appdir/usr/share/icons/hicolor/256x256/apps
          cat > cli-appdir/usr/share/applications/moq2ts-cli.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=moq2ts CLI
          Exec=moq2ts-cli
          Icon=moq2ts-cli
          Categories=AudioVideo;
          Terminal=true
          EOF
          convert -size 256x256 xc:'#1565c0' \
            cli-appdir/usr/share/icons/hicolor/256x256/apps/moq2ts-cli.png
          ./linuxdeploy-x86_64.AppImage --appdir cli-appdir --plugin qt \
            --executable build/moq2ts-cli \
            --desktop-file cli-appdir/usr/share/applications/moq2ts-cli.desktop \
            --output appimage
          mv "$OUTPUT" dist/
          # The packaged CLI starts and prints its options.
          chmod +x "dist/$OUTPUT"
          "./dist/$OUTPUT" --help | grep -q -- --endpoint

      - uses: actions/upload-artifact@v5
        with:
          name: moq2ts-linux
          path: dist/*.AppImage
          if-no-files-found: error

  macos:
    name: macos (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew update
          # openssl@3.6, not openssl@3: the moqxr SDK's picotls is built against
          # OpenSSL 3.6 and needs OPENSSL_sk_set_thunks, which openssl@3 (now
          # 3.5) lacks.
          brew install qt ffmpeg openh264 opus openssl@3 openssl@3.6 srt pkg-config cmake ninja

      - name: Fetch moqxr SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release download "$MOQXR_VERSION" --repo openmoq/moqxr \
            --pattern '*macOS*' --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/moqxr-sdk"
          tar xzf "$RUNNER_TEMP"/openmoq-publisher-*-macOS.tar.gz \
            -C "$RUNNER_TEMP/moqxr-sdk" --strip-components=1
          echo "MOQXR_SDK_DIR=$RUNNER_TEMP/moqxr-sdk" >> "$GITHUB_ENV"

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOQ2TS_BUILD_WITH_MOCK_MOQXR=OFF
          -DMOQXR_SDK_DIR="$MOQXR_SDK_DIR"
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix)"
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3.6)"

      - name: Build
        run: cmake --build build --parallel

      - name: Package app bundle
        run: |
          set -eux
          APP="build/moq2ts-publisher.app"
          # moq2ts-cli goes into the bundle so macdeployqt fixes up its Qt and
          # library paths too; run it as moq2ts-publisher.app/Contents/MacOS/moq2ts-cli.
          cp build/moq2ts-cli "$APP/Contents/MacOS/"
          "$(brew --prefix qt)/bin/macdeployqt" "$APP" -verbose=1 \
            -executable="$APP/Contents/MacOS/moq2ts-cli"
          "$APP/Contents/MacOS/moq2ts-cli" --help | grep -q -- --endpoint
          mkdir -p dist
          ditto -c -k --keepParent "$APP" dist/moq2ts-publisher-macos.zip

      - uses: actions/upload-artifact@v5
        with:
          name: moq2ts-macos
          path: dist/moq2ts-publisher-macos.zip
          if-no-files-found: error

  windows:
    name: windows (x86_64)
    # Off by default: run it from a manual dispatch with "windows" set, or set
    # the repository variable BUILD_WINDOWS to "true" to build it on every run.
    if: ${{ inputs.windows || vars.BUILD_WINDOWS == 'true' }}
    # The image moqxr releases its SDK on: its static libraries call MSVC STL
    # helpers that an older toolset cannot link.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # moqxr ships an MSVC-built Windows SDK, so moq2ts must also build with MSVC
      # (the MinGW ABI is incompatible). Qt comes from the official MSVC binaries
      # and the codec stack from vcpkg.
      - name: Install Qt (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtmultimedia
          cache: true

      - name: Install codecs (vcpkg)
        shell: pwsh
        run: |
          # pkg-config lets moq2ts's pkg_check_modules locate the vcpkg ffmpeg.
          choco install pkgconfiglite --no-progress -y
          vcpkg install --triplet x64-windows `
            "ffmpeg[avcodec,avformat,avdevice,swresample,swscale]" `
            openh264 opus

      - name: Fetch moqxr SDK (MSVC)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:MOQXR_VERSION --repo openmoq/moqxr `
            --pattern '*Windows*' --dir $env:RUNNER_TEMP
          $zip = Get-ChildItem "$env:RUNNER_TEMP\openmoq-publisher-*-Windows.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\moqxr-extract" -Force
          $inner = Get-ChildItem "$env:RUNNER_TEMP\moqxr-extract" -Directory | Select-Object -First 1
          "MOQXR_SDK_DIR=$($inner.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig"
          cmake -S . -B build -A x64 `
            -DMOQ2TS_BUILD_WITH_MOCK_MOQXR=OFF `
            -DMOQXR_SDK_DIR="$env:MOQXR_SDK_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $stage = "dist\moq2ts-publisher"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build\Release\moq2ts-publisher.exe $stage\
          Copy-Item build\Release\moq2ts-cli.exe $stage\
          # Bundle the Qt runtime/plugins.
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --compiler-runtime "$stage\moq2ts-publisher.exe"
          # Bundle the vcpkg codec DLLs (ffmpeg/openh264/opus and their deps).
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" $stage\ -Force

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/moq2ts-publisher/* -DestinationPath dist/moq2ts-publisher-windows.zip

      - uses: actions/upload-artifact@v5
        with:
          name: moq2ts-windows
          path: dist/moq2ts-publisher-windows.zip
          if-no-files-found: error

  release:
    name: release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    # Windows is optional (see its job): a skipped Windows build still releases.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.linux.result == 'success' && needs.macos.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.windows.result) }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List assets
        run: find artifacts -type f

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
